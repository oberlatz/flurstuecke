<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Flurstücke Brandenburg</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
  :root { --bg:#f6f7f4; --fg:#1d2a22; --acc:#0b6b4a; --line:#cfd6cf; --glass:rgba(246,247,244,.93); }
  @media (prefers-color-scheme: dark) { :root { --bg:#16201a; --fg:#e8eee9; --acc:#5fd3a1; --line:#34443a; --glass:rgba(22,32,26,.93); } }
  html, body { height:100%; margin:0; overflow:hidden; background:var(--bg); color:var(--fg); font:16px/1.4 system-ui, sans-serif; }
  #map { position:fixed; inset:0; }
  .leaflet-top { top:env(safe-area-inset-top, 0px); }
  button { font:inherit; padding:8px 10px; border-radius:8px; border:1px solid var(--acc); background:var(--acc); color:var(--bg); }

  /* Oben: Suchkapsel (zugeklappt nur ein Lupen-Knopf) */
  #top { position:fixed; z-index:1100; left:8px; right:8px; top:calc(8px + env(safe-area-inset-top, 0px)); display:flex; pointer-events:none; }
  #search { pointer-events:auto; display:flex; align-items:center; gap:6px; background:var(--glass); border:1px solid var(--line); border-radius:26px; padding:4px; box-shadow:0 2px 8px rgba(0,0,0,.25); }
  #search.open { flex:1; min-width:0; }
  #top { min-width:0; }
  #sbtn, #go { width:40px; height:40px; padding:0; border-radius:50%; display:grid; place-items:center; flex:none; }
  #sbtn span, #go span { display:grid; }
  #sbtn .i-close { display:none; }
  #search.open #sbtn .i-close { display:grid; }
  #search.open #sbtn .i-open { display:none; }
  #sfields { display:none; flex:1; gap:6px; min-width:0; }
  #search.open #sfields { display:flex; }
  #sfields input { box-sizing:border-box; min-width:0; padding:8px; font:inherit; font-size:.95rem; color:var(--fg); background:var(--bg); border:1px solid var(--line); border-radius:8px; }
  #sg { width:92px; flex:none; } #sz { flex:1; width:0; }

  /* Unten: Standort-Knopf und eine schmale Infokarte */
  #bottom { position:fixed; z-index:1100; left:8px; right:8px; bottom:calc(8px + env(safe-area-inset-bottom, 0px)); display:flex; flex-direction:column; align-items:flex-end; gap:8px; pointer-events:none; }
  #loc { pointer-events:auto; width:48px; height:48px; padding:0; border-radius:50%; display:grid; place-items:center; box-shadow:0 2px 8px rgba(0,0,0,.3); }
  #info { pointer-events:auto; align-self:stretch; box-sizing:border-box; display:flex; flex-wrap:wrap; gap:4px 14px; max-height:40vh; overflow:auto; padding:8px 12px; font-size:.85rem; background:var(--glass); border:1px solid var(--line); border-radius:14px; box-shadow:0 2px 8px rgba(0,0,0,.25); }
  #iloc, #isea { flex:1 1 140px; min-width:0; max-height:2.8em; overflow:hidden; }
  #info.open #iloc, #info.open #isea { max-height:none; }
  #iloc::before, #isea::before { content:""; display:inline-block; width:10px; height:10px; border-radius:50%; margin-right:6px; background:#1a73e8; }
  #isea::before { background:#d9480f; }

  /* Trefferliste in der Infokarte */
  #isea.wide { flex-basis:100%; max-height:none; }
  .chips { display:flex; flex-wrap:wrap; gap:6px; margin-top:6px; }
  .chip { padding:4px 10px; font-size:.8rem; border-radius:14px; background:transparent; color:var(--acc); }
  .chip.sel { background:var(--acc); color:var(--bg); }

  /* Quellenangabe: kleiner ©-Knopf oben rechts */
  .cr { text-align:right; }
  .crb { padding:1px 8px; font-size:.8rem; opacity:.75; background:var(--bg); color:var(--acc); border-radius:6px; }
  .crt { background:var(--bg); color:var(--fg); font-size:.75rem; padding:4px 8px; border-radius:6px; margin-top:4px; }
</style>
</head>
<body>
<div id="map"></div>
<div id="top">
  <div id="search">
    <button id="sbtn" aria-label="Suche öffnen oder schließen"><span class="i-open"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5L21 21"/></svg></span><span class="i-close"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></span></button>
    <div id="sfields">
      <input id="sz" placeholder="z. B. 3 289 oder 289/2" aria-label="Flur und Flurstück, z. B. 3 289 oder 289/2" enterkeyhint="search" autocomplete="off">
      <input id="sg" inputmode="numeric" maxlength="4" placeholder="Gemarkung" aria-label="Gemarkungsnummer (optional)" autocomplete="off">
      <button id="go" aria-label="Suchen"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5L21 21"/></svg></button>
    </div>
  </div>
</div>
<div id="bottom">
  <button id="loc" aria-label="Mein Standort"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v4M12 18v4M2 12h4M18 12h4"/></svg></button>
  <div id="info"><div id="iloc"><b>Standort:</b> wird ermittelt …</div><div id="isea"><b>Auswahl:</b> Karte antippen oder suchen.</div></div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
// --- Konfiguration (bei Bedarf anhand von GetCapabilities anpassen) ---
const WMS_URL   = "https://inspire.brandenburg.de/services/cp_alkis_wms";
const WMS_LAYER = "CP.CadastralParcel";   // INSPIRE-Standardname, bitte gegen GetCapabilities prüfen
const START     = [52.35, 12.85];          // Raum Potsdam/Beetzsee

const map = L.map("map", { attributionControl: false, zoomControl: false }).setView(START, 17);
const osm = L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
  maxZoom: 19, attribution: "&copy; OpenStreetMap-Mitwirkende"
}).addTo(map);
map.createPane("flur");
map.getPane("flur").style.zIndex = 250;

// Ein einziges WMS-Bild pro Kartenausschnitt statt Kacheln:
// Der Dienst beschriftet jede Kachel einzeln, dadurch erschienen Flurstücksnummern mehrfach.
const cr = L.control({ position: "topright" });
cr.onAdd = () => {
  const d = L.DomUtil.create("div", "cr");
  d.innerHTML = '<button class="crb" aria-label="Quellen">&copy;</button><div class="crt" hidden>&copy; OpenStreetMap-Mitwirkende<br>&copy; GeoBasis-DE/LGB, dl-de/by-2-0<br><a href="#" class="clr">Karten-Cache leeren</a></div>';
  L.DomEvent.disableClickPropagation(d);
  d.querySelector(".clr").onclick = e => {
    e.preventDefault();
    caches.delete(CACHE_NAME).then(() => { flurView = null; updateFlur(); });
  };
  d.querySelector("button").onclick = () => { const t = d.querySelector(".crt"); t.hidden = !t.hidden; };
  return d;
};
cr.addTo(map);
// --- Cache: Flurstücke ändern sich selten, Bilder werden 30 Tage lokal gespeichert ---
// Die Bilder liegen auf einem festen Raster (Zoom + Rasterzelle), damit dieselbe Gegend
// immer dieselbe Anfrage ergibt und aus dem Cache kommt.
const CACHE_NAME = "flur-v1";
const CACHE_MAX_AGE = 30 * 24 * 3600 * 1000;
const CELL = 512;   // Rasterweite in Pixeln

async function cachedImageUrl(url) {
  try {
    const cache = await caches.open(CACHE_NAME);
    const hit = await cache.match(url);
    if (hit && Date.now() - Number(hit.headers.get("x-cached-at") || 0) < CACHE_MAX_AGE) {
      return URL.createObjectURL(await hit.blob());
    }
    const r = await fetch(url);
    if (!r.ok || !(r.headers.get("content-type") || "").startsWith("image")) throw new Error("kein Bild");
    const blob = await r.blob();
    await cache.put(url, new Response(blob, { headers: { "x-cached-at": String(Date.now()), "content-type": blob.type } }));
    return URL.createObjectURL(blob);
  } catch (e) {
    return url;   // Fallback: direkt vom Dienst laden
  }
}

let flurOverlay = null, flurView = null, flurToken = 0;
async function updateFlur() {
  const P = L.CRS.EPSG3857;
  const z = map.getZoom();
  const vsw = P.project(map.getBounds().getSouthWest());
  const vne = P.project(map.getBounds().getNorthEast());
  if (flurView && flurView.z === z && vsw.x >= flurView.x0 && vne.x <= flurView.x1 && vsw.y >= flurView.y0 && vne.y <= flurView.y1) return;
  const res = 156543.03392804097 / Math.pow(2, z);          // Meter pro Pixel
  const s = map.getSize();
  const img = Math.min(2048, Math.max(1536, Math.ceil(Math.max(s.x, s.y) * 1.5 / CELL) * CELL));
  const c = P.project(map.getCenter());
  const cx = Math.round(c.x / (CELL * res)) * CELL * res;
  const cy = Math.round(c.y / (CELL * res)) * CELL * res;
  const half = img / 2 * res;
  const view = { z, x0: cx - half, x1: cx + half, y0: cy - half, y1: cy + half };
  const url = WMS_URL + "?" + new URLSearchParams({
    SERVICE: "WMS", VERSION: "1.3.0", REQUEST: "GetMap", LAYERS: WMS_LAYER, STYLES: "",
    FORMAT: "image/png", TRANSPARENT: "TRUE", CRS: "EPSG:3857",
    BBOX: [view.x0, view.y0, view.x1, view.y1].map(v => v.toFixed(3)).join(","), WIDTH: img, HEIGHT: img
  });
  const token = ++flurToken;
  const src = await cachedImageUrl(url);
  if (token !== flurToken) return;
  const bounds = L.latLngBounds(P.unproject(L.point(view.x0, view.y0)), P.unproject(L.point(view.x1, view.y1)));
  const next = L.imageOverlay(src, bounds, { pane: "flur" }).addTo(map);
  next.once("load", () => {
    if (token !== flurToken) { map.removeLayer(next); return; }
    if (flurOverlay) {
      map.removeLayer(flurOverlay);
      if (flurOverlay._blob) URL.revokeObjectURL(flurOverlay._blob);
    }
    next._blob = src.startsWith("blob:") ? src : null;
    flurOverlay = next; flurView = view;
  });
}
map.on("moveend", updateFlur);
updateFlur();

// --- Standort (unabhängig von der Suche): Punkt immer sichtbar, Flurstück am Standort blau markiert ---
const BLUE = "#1a73e8", ORANGE = "#d9480f";
let tapMarker = null;
function setTap(latlng) {
  if (tapMarker) tapMarker.setLatLng(latlng);
  else tapMarker = L.circleMarker(latlng, { radius: 6, color: "#555", weight: 2, fillOpacity: 0, interactive: false }).addTo(map);
}

function inRing(pt, ring) {   // pt = [Breite, Länge], Ring aus [Breite, Länge]
  let inside = false;
  for (let i = 0, j = ring.length - 1; i < ring.length; j = i++) {
    const [yi, xi] = ring[i], [yj, xj] = ring[j];
    if ((yi > pt[0]) !== (yj > pt[0]) && pt[1] < (xj - xi) * (pt[0] - yi) / (yj - yi) + xi) inside = !inside;
  }
  return inside;
}
function inPolys(ll, polys) {
  const pt = [ll.lat, ll.lng];
  return polys.some(rings => inRing(pt, rings[0]) && !rings.slice(1).some(h => inRing(pt, h)));
}

function drawPolys(polys, color) {
  const p0 = polys[0] && polys[0][0] && polys[0][0][0];
  if (!(p0 && p0[0] > 45 && p0[0] < 56)) return null;   // Koordinaten unplausibel (Breitengrad in Deutschland)
  return L.featureGroup(polys.map(r => L.polygon(r, { color, weight: 3, fillOpacity: .15, interactive: false }))).addTo(map);
}

let locMarker = null, locAcc = null, locHl = null, locPolys = null, locLL = null;
let locBusy = false, locRetryAt = 0, firstFix = true;

function onPos(p) {
  const ll = L.latLng(p.coords.latitude, p.coords.longitude);
  locLL = ll;
  if (!locMarker) {
    locAcc = L.circle(ll, { radius: p.coords.accuracy, color: BLUE, weight: 1, fillOpacity: .1, interactive: false }).addTo(map);
    locMarker = L.circleMarker(ll, { radius: 7, color: "#fff", weight: 2, fillColor: BLUE, fillOpacity: 1, interactive: false }).addTo(map);
  } else {
    locMarker.setLatLng(ll); locAcc.setLatLng(ll); locAcc.setRadius(p.coords.accuracy);
  }
  if (firstFix) { firstFix = false; map.setView(ll, 19); }
  updateLocParcel(ll);
}

// Flurstück am Standort: nur neu abfragen, wenn der Standort das bisherige Flurstück verlässt
async function updateLocParcel(ll) {
  if (locBusy || Date.now() < locRetryAt) return;
  if (locPolys && locPolys.length && inPolys(ll, locPolys)) return;
  locBusy = true;
  try {
    const res = await parcelAt(ll);
    if (locHl) { map.removeLayer(locHl); locHl = null; }
    if (res) {
      locPolys = res.polys;
      locHl = drawPolys(res.polys, BLUE);
      if (!locHl) locRetryAt = Date.now() + 15000;   // keine Geometrie: später erneut versuchen
      infoLoc("<b>Standort:</b> Flurstück " + esc(res.label || res.ref || "?") + " · " + res.area.toLocaleString("de-DE") + " m²");
    } else {
      locPolys = null; locRetryAt = Date.now() + 15000;
      infoLoc("<b>Standort:</b> kein Flurstück gefunden<br><small>" + esc(diag.join(" | ")) + "</small>");
    }
  } finally {
    locBusy = false;
    if (locMarker) locMarker.bringToFront();
  }
}

async function parcelAt(ll) {
  diag = [];
  const pt = `<fes:Intersects><fes:ValueReference>cp:geometry</fes:ValueReference><gml:Point srsName="urn:ogc:def:crs:EPSG::4326"><gml:pos>${ll.lat} ${ll.lng}</gml:pos></gml:Point></fes:Intersects>`;
  const list = await wfsQuery("P", fWrap(pt));
  if (list.length) return list[0];
  try {   // Ausweg: Kennzeichen über den Kartendienst, dann wie bei der Suche abrufen
    const txt = await fetchFI(ll);
    const id = parseId(txt);
    if (id) {
      const full = await findParcel(id.gem, id.flur, [null, String(Number(id.zaehler)), id.nenner], ll);
      if (full) return full;
      const a = txt.match(/areaValue\s*([\d.,]+)\s*m/i);
      if (a) return { area: Number(a[1].replace(",", ".")), polys: [], ref: "", label: String(Number(id.zaehler)) + (id.nenner ? "/" + id.nenner : "") };
    } else {
      diag.push("WMS: kein Flurstück am Standort");
    }
  } catch (e) { diag.push("WMS: " + e.message); }
  return null;
}

function startTracking() {
  if (!navigator.geolocation) { infoLoc("<b>Standort:</b> wird von diesem Browser nicht unterstützt."); return; }
  navigator.geolocation.watchPosition(onPos,
    e => infoLoc("<b>Standort:</b> nicht verfügbar (" + esc(e.message) + "). Die Seite braucht https und die Standortfreigabe."),
    { enableHighAccuracy: true, maximumAge: 5000, timeout: 20000 });
}
document.getElementById("loc").onclick = () => {
  if (locLL) map.setView(locLL, 19); else infoLoc("<b>Standort:</b> noch kein Standort empfangen.");
};

map.on("click", e => { closeSearch(); setTap(e.latlng); query(e.latlng); });

function info(html, wide) { const e = document.getElementById("isea"); e.innerHTML = html; e.classList.toggle("wide", !!wide); }
function infoLoc(html) { document.getElementById("iloc").innerHTML = html; }

const sg = document.getElementById("sg");
let hl = null;   // hervorgehobenes Flurstück aus der Suche

// WMS-Abfrage am Punkt (festes Fenster von 101 x 101 Pixeln, unabhängig von Kartenausschnitt und Zoom)
async function fetchFI(latlng) {
  const c = L.CRS.EPSG3857.project(latlng);
  const h = 50 * 0.3;   // 0,3 m pro Pixel
  const p = new URLSearchParams({
    SERVICE: "WMS", VERSION: "1.3.0", REQUEST: "GetFeatureInfo",
    LAYERS: WMS_LAYER, QUERY_LAYERS: WMS_LAYER, STYLES: "",
    CRS: "EPSG:3857", BBOX: [c.x - h, c.y - h, c.x + h, c.y + h].join(","),
    WIDTH: 101, HEIGHT: 101, I: 50, J: 50,
    INFO_FORMAT: "text/html", FEATURE_COUNT: 1
  });
  const r = await fetch(WMS_URL + "?" + p);
  if (!r.ok) throw new Error("HTTP " + r.status);
  const html = await r.text();
  return new DOMParser().parseFromString(html, "text/html").body.textContent.replace(/\s+/g, " ");
}

// Kennzeichen: Land(2) Gemarkung(4) Flur(3) Zähler(5), z. B. CadastralParcel_12173000300289______
function parseId(txt) {
  const m = txt.match(/CadastralParcel_(\d{2})(\d{4})(\d{3})(\d{5})([\d_]{4})?/);
  if (!m) return null;
  const nenner = m[5] && /^\d{4}$/.test(m[5]) ? String(Number(m[5])) : "";
  return { gem: m[2], flur: m[3], zaehler: m[4], nenner };
}

// Antippen der Karte: Flurstück erkennen, Suchfeld füllen und dieselbe Suche ausführen
async function query(latlng) {
  if (hl) { map.removeLayer(hl); hl = null; }
  setTap(latlng);
  info("Frage Flurstück ab …");
  try {
    const txt = await fetchFI(latlng);
    const id = parseId(txt);
    if (!id) { info("Kein Flurstück an dieser Stelle gefunden."); return; }
    const spec = { flur: Number(id.flur), z: Number(id.zaehler), n: id.nenner ? Number(id.nenner) : 0 };
    const nr = spec.z + (spec.n ? "/" + spec.n : "");
    document.getElementById("sz").value = spec.flur + " " + nr;
    const a = txt.match(/areaValue\s*([\d.,]+)\s*m/i);
    if (a) info("<b>Auswahl:</b> Flurstück " + esc(nr) + " · " + Number(a[1].replace(",", ".")).toLocaleString("de-DE") + " m²");
    await search({ spec, gem: id.gem, fit: false, near: latlng, quiet: true });   // Umriss dazu, Karte bleibt stehen
  } catch (err) {
    info("Abfrage fehlgeschlagen (" + err.message + "). Mögliche Ursache: Dienst erlaubt keine Browser-Abfragen (CORS) oder der Layername ist anders.");
  }
}

// --- Suche nach Flur und Flurstück (WFS, Abruf über die Flurstücks-ID) ---
const WFS_URL = "https://inspire.brandenburg.de/services/cp_alkis_wfs";   // bitte gegen GetCapabilities prüfen
const LAND = "12";                                                       // Brandenburg
const pad = (s, n) => String(s).padStart(n, "0");
const esc = s => String(s).replace(/[&<>]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));
let diag = [];   // Rückmeldungen des Dienstes, werden bei „Nicht gefunden“ angezeigt

const FES_NS = 'xmlns:fes="http://www.opengis.net/fes/2.0" xmlns:gml="http://www.opengis.net/gml/3.2" xmlns:cp="http://inspire.ec.europa.eu/schemas/cp/4.0"';
const fEq = (prop, val) => `<fes:PropertyIsEqualTo><fes:ValueReference>${prop}</fes:ValueReference><fes:Literal>${val}</fes:Literal></fes:PropertyIsEqualTo>`;
const fLike = (prop, val) => `<fes:PropertyIsLike wildCard="*" singleChar="?" escapeChar="\\"><fes:ValueReference>${prop}</fes:ValueReference><fes:Literal>${val}</fes:Literal></fes:PropertyIsLike>`;
const fWrap = inner => `<fes:Filter ${FES_NS}>${inner}</fes:Filter>`;

// Eine WFS-Abfrage mit Filter; liefert die gefundenen Flurstücke als Liste
async function wfsQuery(name, filter, count = 20) {
  const p = new URLSearchParams({
    SERVICE: "WFS", VERSION: "2.0.0", REQUEST: "GetFeature", TYPENAMES: "cp:CadastralParcel",
    COUNT: String(count), SRSNAME: "urn:ogc:def:crs:EPSG::4326", FILTER: filter
  });
  try {
    const r = await fetch(WFS_URL + "?" + p);
    const txt = await r.text();
    const xml = new DOMParser().parseFromString(txt, "application/xml");
    const ex = xml.getElementsByTagNameNS("*", "ExceptionText")[0];
    if (!r.ok || ex) { diag.push(name + ": " + (ex ? ex.textContent.trim().slice(0, 160) : "HTTP " + r.status)); return []; }
    const list = [...xml.getElementsByTagNameNS("*", "CadastralParcel")].map(parseParcel).filter(Boolean);
    diag.push(name + ": " + list.length + " Treffer");
    return list;
  } catch (e) { diag.push(name + ": " + e.message); return []; }
}

function parseParcel(el) {
  const g = n => el.getElementsByTagNameNS("*", n)[0];
  const a = g("areaValue");
  if (!a) return null;
  const polys = [];
  for (const pg of el.getElementsByTagNameNS("*", "Polygon")) {
    const rings = [];
    for (const pl of pg.getElementsByTagNameNS("*", "posList")) {
      const w = pl.textContent.trim().split(/\s+/).map(Number);
      const ring = [];
      for (let i = 0; i + 1 < w.length; i += 2) ring.push([w[i], w[i + 1]]);   // Breite, Länge
      rings.push(ring);
    }
    if (rings.length) polys.push(rings);
  }
  const ref = g("nationalCadastralReference");
  const lab = g("label");
  return { area: Number(a.textContent), polys, ref: ref ? ref.textContent.trim() : "", label: lab ? lab.textContent.trim() : "" };
}

// Sucht das Flurstück in drei Stufen: exaktes Kennzeichen, Kennzeichen-Anfang, Nummer + Umkreis
async function findParcel(gem, flur, m, near = map.getCenter()) {
  const ref14 = LAND + gem + pad(flur, 3) + pad(m[1], 5);
  const nenner = m[2] ? pad(m[2], 4) : "";
  const passt = f => f.ref.startsWith(ref14) && (nenner ? f.ref.slice(14, 18) === nenner : /^_*$/.test(f.ref.slice(14)));
  let list = await wfsQuery("A", fWrap(fEq("cp:nationalCadastralReference", ref14 + (nenner || "____") + "__")));
  let hit = list.find(passt); if (hit) return hit;
  list = await wfsQuery("B", fWrap(fLike("cp:nationalCadastralReference", ref14 + "*")));
  hit = list.find(passt); if (hit) return hit;
  const c = near, d = 0.04;
  const box = `<fes:BBOX><fes:ValueReference>cp:geometry</fes:ValueReference><gml:Envelope srsName="urn:ogc:def:crs:EPSG::4326"><gml:lowerCorner>${c.lat - d} ${c.lng - d}</gml:lowerCorner><gml:upperCorner>${c.lat + d} ${c.lng + d}</gml:upperCorner></gml:Envelope></fes:BBOX>`;
  const label = String(Number(m[1])) + (m[2] ? "/" + Number(m[2]) : "");
  list = await wfsQuery("C", fWrap(`<fes:And>${fEq("cp:label", label)}${box}</fes:And>`));
  hit = list.find(passt);
  if (!hit && list.length) diag.push("C: Kennzeichen der Treffer: " + list.map(f => f.ref).join(", "));
  return hit || null;
}

// --- Eingabe verstehen: "289", "289/2", "3 289", "Flur 3 Flurstück 289/2" ---
function parseInput(t) {
  const s = String(t).toLowerCase().replace(/flurst(?:ü|u)cke?|flst\.?|flur|fl\./g, " ").replace(/[;,]/g, " ").trim();
  const tok = s.split(/\s+/).filter(Boolean);
  const nr = x => { const m = x.match(/^(\d{1,5})(?:[\/-](\d{1,4}))?$/); return m ? { z: Number(m[1]), n: m[2] ? Number(m[2]) : 0 } : null; };
  if (tok.length === 1) { const a = nr(tok[0]); return a && a.z > 0 ? { flur: null, z: a.z, n: a.n } : null; }
  if (tok.length === 2 && /^\d{1,3}$/.test(tok[0])) { const a = nr(tok[1]); return a && a.z > 0 ? { flur: Number(tok[0]), z: a.z, n: a.n } : null; }
  return null;
}

// --- Umkreissuche: Flurstücksnummer in der Nähe, Gemarkung und Flur optional ---
const RADIUS_KM = 5, MAX_KM = 15;
const searchCenter = () => (locLL && map.getBounds().contains(locLL)) ? locLL : map.getCenter();

function parcelCenter(f) {
  const ring = f.polys[0] && f.polys[0][0];
  if (!ring || !ring.length) return null;
  let a = 0, b = 0;
  for (const [y, x] of ring) { a += y; b += x; }
  return L.latLng(a / ring.length, b / ring.length);
}

async function radiusSearch(spec, gem, c, km) {
  const dLat = km / 111.32, dLng = km / (111.32 * Math.cos(c.lat * Math.PI / 180));
  const box = `<fes:BBOX><fes:ValueReference>cp:geometry</fes:ValueReference><gml:Envelope srsName="urn:ogc:def:crs:EPSG::4326"><gml:lowerCorner>${c.lat - dLat} ${c.lng - dLng}</gml:lowerCorner><gml:upperCorner>${c.lat + dLat} ${c.lng + dLng}</gml:upperCorner></gml:Envelope></fes:BBOX>`;
  const label = spec.z + (spec.n ? "/" + spec.n : "");
  const list = await wfsQuery("U" + km, fWrap(`<fes:And>${fEq("cp:label", label)}${box}</fes:And>`), 60);
  return list
    .filter(f => !/^\d{14}/.test(f.ref) || ((!gem || f.ref.slice(2, 6) === gem) && (spec.flur == null || f.ref.slice(6, 9) === pad(spec.flur, 3))))
    .map(f => { const p = parcelCenter(f); return { ...f, dist: p ? c.distanceTo(p) : Infinity }; })
    .sort((a, b) => a.dist - b.dist);
}

const fmtDist = m => !isFinite(m) ? "" : m < 1000 ? Math.round(m / 10) * 10 + " m" : (m / 1000).toFixed(1).replace(".", ",") + " km";
function chipText(f, multiGem) {
  const ok = /^\d{14}/.test(f.ref);
  const parts = [];
  if (ok) parts.push("Flur " + Number(f.ref.slice(6, 9)));
  parts.push(f.label || "?");
  parts.push(f.area.toLocaleString("de-DE") + " m²");
  if (multiGem && ok) parts.push("Gem. " + f.ref.slice(2, 6));
  const d = fmtDist(f.dist);
  if (d) parts.push(d);
  return parts.join(" · ");
}

// Mehrere Treffer: kurze Auswahl in der Infokarte
function showChoices(list, sel) {
  const multiGem = new Set(list.map(f => f.ref.slice(2, 6))).size > 1;
  const chips = list.slice(0, 12).map((f, i) => `<button class="chip${i === sel ? " sel" : ""}" data-i="${i}">${esc(chipText(f, multiGem))}</button>`).join("");
  const head = sel < 0
    ? "<b>Auswahl:</b> " + list.length + " Treffer, bitte wählen"
    : "<b>Auswahl:</b> Flurstück " + esc(list[sel].label || "?") + " · " + list[sel].area.toLocaleString("de-DE") + " m²";
  info(head + '<div class="chips">' + chips + "</div>", true);
  document.getElementById("isea").querySelectorAll(".chip").forEach(b => {
    b.onclick = e => { e.stopPropagation(); const i = Number(b.dataset.i); drawResult(list[i], true); showChoices(list, i); };
  });
}

async function radiusFlow(spec, gem, km, opts) {
  const c = opts.near || searchCenter();
  diag = [];
  if (!opts.quiet) info("Suche im Umkreis von " + km + " km …");
  const list = await radiusSearch(spec, gem, c, km);
  if (!list.length) {
    if (!opts.quiet) {
      info("Nichts gefunden im Umkreis von " + km + " km." + (km < MAX_KM ? ' <button class="chip" id="more">Umkreis ' + MAX_KM + " km</button>" : "") + "<br><small>" + esc(diag.join(" | ")) + "</small>", true);
      const more = document.getElementById("more");
      if (more) more.onclick = async e => { e.stopPropagation(); if (await radiusFlow(spec, gem, MAX_KM, opts)) closeSearch(); };
    }
    return false;
  }
  if (list.length === 1) { showResult(list[0], opts.fit !== false); return true; }
  if (hl) { map.removeLayer(hl); hl = null; }
  showChoices(list, -1);
  return true;
}

function drawResult(res, fit = true) {
  if (hl) { map.removeLayer(hl); hl = null; }
  hl = drawPolys(res.polys, ORANGE);
  if (hl && fit) map.fitBounds(hl.getBounds(), { maxZoom: 19, padding: [30, 30] });
}
function showResult(res, fit = true) {
  drawResult(res, fit);
  info("<b>Auswahl:</b> Flurstück " + esc(res.label || res.ref || "?") + " · " + res.area.toLocaleString("de-DE") + " m²");
}

async function search(opts = {}) {
  const spec = opts.spec || parseInput(document.getElementById("sz").value);
  if (!spec) { info("Bitte Flur und Flurstück eingeben, z. B. „3 289“ oder „289/2“."); return; }
  if (!opts.near && tapMarker) { map.removeLayer(tapMarker); tapMarker = null; }   // Ring vom Antippen entfernen
  diag = [];
  const gem = opts.gem || (/^\d{4}$/.test(sg.value.trim()) ? sg.value.trim() : null);
  try {
    if (gem && spec.flur != null) {   // alles bekannt: direkt über das Kennzeichen
      if (!opts.quiet) info("Suche …");
      const m = [null, String(spec.z), spec.n ? String(spec.n) : ""];
      const gmlId = "CadastralParcel_" + LAND + gem + pad(spec.flur, 3) + pad(spec.z, 5) + (spec.n ? pad(spec.n, 4) : "____") + "__";
      const key = "fs:" + gmlId;
      let res = null;
      try {   // Flurstücke ändern sich selten: Treffer 30 Tage lokal merken
        const c = JSON.parse(localStorage.getItem(key) || "null");
        if (c && Date.now() - c.t < CACHE_MAX_AGE) res = c.res;
      } catch (e) {}
      if (!res) {
        res = await findParcel(gem, spec.flur, m, opts.near || searchCenter());
        if (res) { try { localStorage.setItem(key, JSON.stringify({ t: Date.now(), res })); } catch (e) {} }
      }
      if (res) { showResult(res, opts.fit !== false); return true; }
    }
    if (opts.quiet) return;   // Antippen: Fläche bleibt stehen, keine weitere Suche
    return await radiusFlow(spec, gem, RADIUS_KM, opts);
  } catch (err) {
    if (!opts.quiet) info("Suche fehlgeschlagen (" + err.message + ").");
  }
}
const searchBox = document.getElementById("search");
const closeSearch = () => searchBox.classList.remove("open");
async function doSearch() { if (await search()) closeSearch(); }
document.getElementById("go").onclick = doSearch;
document.getElementById("sbtn").onclick = () => {
  searchBox.classList.toggle("open");
  if (searchBox.classList.contains("open")) {
    document.getElementById("sz").focus();
    if (!hl) info("<b>Auswahl:</b> Suche im Umkreis von " + RADIUS_KM + " km. Eingabe z. B. „3 289“ (Flur, Flurstück) oder „289/2“.");
  }
};
document.getElementById("info").onclick = e => e.currentTarget.classList.toggle("open");
for (const id of ["sz", "sg"]) document.getElementById(id).addEventListener("keydown", e => { if (e.key === "Enter") doSearch(); });

startTracking();   // Standort laufend anzeigen
</script>
</body>
</html>
