<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Flurstücke Brandenburg</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
  :root { --bg:#f6f7f4; --fg:#1d2a22; --acc:#0b6b4a; --line:#cfd6cf; }
  @media (prefers-color-scheme: dark) { :root { --bg:#16201a; --fg:#e8eee9; --acc:#5fd3a1; --line:#34443a; } }
  html, body { height:100%; margin:0; background:var(--bg); color:var(--fg); font:16px/1.4 system-ui, sans-serif; }
  body { display:flex; flex-direction:column; }
  header { display:flex; gap:8px; align-items:center; padding:10px 12px; padding-top:calc(10px + env(safe-area-inset-top, 0px)); border-bottom:1px solid var(--line); }
  header h1 { font-size:1rem; margin:0; flex:1; font-weight:650; }
  button { font:inherit; padding:8px 12px; border-radius:8px; border:1px solid var(--acc); background:var(--acc); color:var(--bg); }
  button.alt { background:transparent; color:var(--acc); }
  #map { flex:1; min-height:0; }
  #info { padding:10px 12px; padding-bottom:calc(10px + env(safe-area-inset-bottom, 0px)); border-top:1px solid var(--line); max-height:30vh; overflow:auto; font-size:.9rem; }
  #search { display:flex; gap:6px; padding:8px 12px; border-bottom:1px solid var(--line); }
  #search input { min-width:0; padding:8px; font:inherit; color:var(--fg); background:var(--bg); border:1px solid var(--line); border-radius:8px; }
  #sg { width:5.6em; } #sf { width:3.6em; } #sz { flex:1; }
  .cr { text-align:right; }
  .crb { padding:1px 8px; font-size:.8rem; opacity:.75; background:var(--bg); color:var(--acc); border-radius:6px; }
  .crt { background:var(--bg); color:var(--fg); font-size:.75rem; padding:4px 8px; border-radius:6px; margin-bottom:4px; }
  #info table { border-collapse:collapse; }
  #info td, #info th { border-bottom:1px solid var(--line); padding:2px 8px 2px 0; text-align:left; }
</style>
</head>
<body>
<header>
  <h1>Flurstücke Brandenburg</h1>
  <button id="loc">Mein Standort</button>
</header>
<div id="search">
  <input id="sg" inputmode="numeric" maxlength="4" placeholder="Gemarkung" aria-label="Gemarkungsnummer">
  <input id="sf" inputmode="numeric" maxlength="3" placeholder="Flur" aria-label="Flur">
  <input id="sz" placeholder="Flurstück" aria-label="Flurstück, z. B. 289 oder 289/2">
  <button id="go">Suchen</button>
</div>
<div id="map"></div>
<div id="info">Karte antippen, um das Flurstück abzufragen.</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
// --- Konfiguration (bei Bedarf anhand von GetCapabilities anpassen) ---
const WMS_URL   = "https://inspire.brandenburg.de/services/cp_alkis_wms";
const WMS_LAYER = "CP.CadastralParcel";   // INSPIRE-Standardname, bitte gegen GetCapabilities prüfen
const START     = [52.35, 12.85];          // Raum Potsdam/Beetzsee

const map = L.map("map", { attributionControl: false }).setView(START, 17);
const osm = L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
  maxZoom: 19, attribution: "&copy; OpenStreetMap-Mitwirkende"
}).addTo(map);

// Ein einziges WMS-Bild pro Kartenausschnitt statt Kacheln:
// Der Dienst beschriftet jede Kachel einzeln, dadurch erschienen Flurstücksnummern mehrfach.
const cr = L.control({ position: "bottomright" });
cr.onAdd = () => {
  const d = L.DomUtil.create("div", "cr");
  d.innerHTML = '<div class="crt" hidden>&copy; OpenStreetMap-Mitwirkende<br>&copy; GeoBasis-DE/LGB, dl-de/by-2-0<br><a href="#" class="clr">Karten-Cache leeren</a></div><button class="crb" aria-label="Quellen">&copy;</button>';
  L.DomEvent.disableClickPropagation(d);
  d.querySelector(".clr").onclick = e => {
    e.preventDefault();
    caches.delete(CACHE_NAME).then(() => { flurView = null; updateFlur(); });
  };
  d.querySelector("button").onclick = () => { const t = d.querySelector(".crt"); t.hidden = !t.hidden; };
  return d;
};
cr.addTo(map);
// --- Cache: Flurstücke ändern sich selten, Bilder werden 30 Tage lokal gespeichert ---
// Die Bilder liegen auf einem festen Raster (Zoom + Rasterzelle), damit dieselbe Gegend
// immer dieselbe Anfrage ergibt und aus dem Cache kommt.
const CACHE_NAME = "flur-v1";
const CACHE_MAX_AGE = 30 * 24 * 3600 * 1000;
const CELL = 512;   // Rasterweite in Pixeln

async function cachedImageUrl(url) {
  try {
    const cache = await caches.open(CACHE_NAME);
    const hit = await cache.match(url);
    if (hit && Date.now() - Number(hit.headers.get("x-cached-at") || 0) < CACHE_MAX_AGE) {
      return URL.createObjectURL(await hit.blob());
    }
    const r = await fetch(url);
    if (!r.ok || !(r.headers.get("content-type") || "").startsWith("image")) throw new Error("kein Bild");
    const blob = await r.blob();
    await cache.put(url, new Response(blob, { headers: { "x-cached-at": String(Date.now()), "content-type": blob.type } }));
    return URL.createObjectURL(blob);
  } catch (e) {
    return url;   // Fallback: direkt vom Dienst laden
  }
}

let flurOverlay = null, flurView = null, flurToken = 0;
async function updateFlur() {
  const P = L.CRS.EPSG3857;
  const z = map.getZoom();
  const vsw = P.project(map.getBounds().getSouthWest());
  const vne = P.project(map.getBounds().getNorthEast());
  if (flurView && flurView.z === z && vsw.x >= flurView.x0 && vne.x <= flurView.x1 && vsw.y >= flurView.y0 && vne.y <= flurView.y1) return;
  const res = 156543.03392804097 / Math.pow(2, z);          // Meter pro Pixel
  const s = map.getSize();
  const img = Math.min(2048, Math.max(1536, Math.ceil(Math.max(s.x, s.y) * 1.5 / CELL) * CELL));
  const c = P.project(map.getCenter());
  const cx = Math.round(c.x / (CELL * res)) * CELL * res;
  const cy = Math.round(c.y / (CELL * res)) * CELL * res;
  const half = img / 2 * res;
  const view = { z, x0: cx - half, x1: cx + half, y0: cy - half, y1: cy + half };
  const url = WMS_URL + "?" + new URLSearchParams({
    SERVICE: "WMS", VERSION: "1.3.0", REQUEST: "GetMap", LAYERS: WMS_LAYER, STYLES: "",
    FORMAT: "image/png", TRANSPARENT: "TRUE", CRS: "EPSG:3857",
    BBOX: [view.x0, view.y0, view.x1, view.y1].map(v => v.toFixed(3)).join(","), WIDTH: img, HEIGHT: img
  });
  const token = ++flurToken;
  const src = await cachedImageUrl(url);
  if (token !== flurToken) return;
  const bounds = L.latLngBounds(P.unproject(L.point(view.x0, view.y0)), P.unproject(L.point(view.x1, view.y1)));
  const next = L.imageOverlay(src, bounds).addTo(map);
  next.once("load", () => {
    if (token !== flurToken) { map.removeLayer(next); return; }
    if (flurOverlay) {
      map.removeLayer(flurOverlay);
      if (flurOverlay._blob) URL.revokeObjectURL(flurOverlay._blob);
    }
    next._blob = src.startsWith("blob:") ? src : null;
    flurOverlay = next; flurView = view;
  });
}
map.on("moveend", updateFlur);
updateFlur();

let marker = null;
function setPos(latlng) {
  if (marker) marker.setLatLng(latlng); else marker = L.circleMarker(latlng, { radius: 7, color: "#0b6b4a", fillOpacity: .9 }).addTo(map);
}

function locate() {
  if (!navigator.geolocation) { info("Standort wird von diesem Browser nicht unterstützt."); return; }
  info("Suche Standort …");
  navigator.geolocation.getCurrentPosition(p => {
    const ll = L.latLng(p.coords.latitude, p.coords.longitude);
    map.setView(ll, 19); setPos(ll); query(ll);
  }, e => info("Standort nicht verfügbar: " + e.message + ". Die Seite braucht https und die Standortfreigabe. Du kannst die Karte trotzdem verschieben und antippen."), { enableHighAccuracy: true, timeout: 15000 });
}
document.getElementById("loc").onclick = locate;

map.on("click", e => { setPos(e.latlng); query(e.latlng); });

function info(html) { document.getElementById("info").innerHTML = html; }

const sg = document.getElementById("sg");
let hl = null;   // hervorgehobenes Flurstück aus der Suche

// WMS-Abfrage am Punkt, liefert den Antworttext (Tabelle als reiner Text)
async function fetchFI(latlng) {
  const size = map.getSize();
  const b = map.getBounds();
  const sw = L.CRS.EPSG3857.project(b.getSouthWest());
  const ne = L.CRS.EPSG3857.project(b.getNorthEast());
  const pt = map.latLngToContainerPoint(latlng);
  const p = new URLSearchParams({
    SERVICE: "WMS", VERSION: "1.3.0", REQUEST: "GetFeatureInfo",
    LAYERS: WMS_LAYER, QUERY_LAYERS: WMS_LAYER, STYLES: "",
    CRS: "EPSG:3857", BBOX: [sw.x, sw.y, ne.x, ne.y].join(","),
    WIDTH: size.x, HEIGHT: size.y, I: Math.round(pt.x), J: Math.round(pt.y),
    INFO_FORMAT: "text/html", FEATURE_COUNT: 1
  });
  const r = await fetch(WMS_URL + "?" + p);
  if (!r.ok) throw new Error("HTTP " + r.status);
  const html = await r.text();
  return new DOMParser().parseFromString(html, "text/html").body.textContent.replace(/\s+/g, " ");
}

// Kennzeichen: Land(2) Gemarkung(4) Flur(3) Zähler(5), z. B. CadastralParcel_12173000300289______
function parseId(txt) {
  const m = txt.match(/CadastralParcel_(\d{2})(\d{4})(\d{3})(\d{5})([\d_]{4})?/);
  if (!m) return null;
  const nenner = m[5] && /^\d{4}$/.test(m[5]) ? String(Number(m[5])) : "";
  return { gem: m[2], flur: m[3], zaehler: m[4], nenner };
}

async function query(latlng) {
  if (hl) { map.removeLayer(hl); hl = null; }
  info("Frage Flurstück ab …");
  try {
    const txt = await fetchFI(latlng);
    const id = parseId(txt);
    if (id) {   // Suchfelder mit dem angetippten Flurstück füllen
      sg.value = id.gem;
      document.getElementById("sf").value = String(Number(id.flur));
      document.getElementById("sz").value = String(Number(id.zaehler)) + (id.nenner ? "/" + id.nenner : "");
    }
    const m = txt.match(/areaValue\s*([\d.,]+)\s*m/i);
    if (m) {
      const n = Number(m[1].replace(",", "."));
      info("<strong style='font-size:1.4rem'>" + n.toLocaleString("de-DE") + " m²</strong>");
    } else {
      info("Kein Flurstück an dieser Stelle gefunden.");
    }
  } catch (err) {
    info("Abfrage fehlgeschlagen (" + err.message + "). Mögliche Ursache: Dienst erlaubt keine Browser-Abfragen (CORS) oder der Layername ist anders. Die Grenzen auf der Karte sind trotzdem sichtbar.");
  }
}

// --- Suche nach Flur und Flurstück (WFS, Abruf über die Flurstücks-ID) ---
const WFS_URL = "https://inspire.brandenburg.de/services/cp_alkis_wfs";   // bitte gegen GetCapabilities prüfen
const LAND = "12";                                                       // Brandenburg
const pad = (s, n) => String(s).padStart(n, "0");
const esc = s => String(s).replace(/[&<>]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));
let diag = [];   // Rückmeldungen des Dienstes, werden bei „Nicht gefunden“ angezeigt

const FES_NS = 'xmlns:fes="http://www.opengis.net/fes/2.0" xmlns:gml="http://www.opengis.net/gml/3.2" xmlns:cp="http://inspire.ec.europa.eu/schemas/cp/4.0"';
const fEq = (prop, val) => `<fes:PropertyIsEqualTo><fes:ValueReference>${prop}</fes:ValueReference><fes:Literal>${val}</fes:Literal></fes:PropertyIsEqualTo>`;
const fLike = (prop, val) => `<fes:PropertyIsLike wildCard="*" singleChar="?" escapeChar="\\"><fes:ValueReference>${prop}</fes:ValueReference><fes:Literal>${val}</fes:Literal></fes:PropertyIsLike>`;
const fWrap = inner => `<fes:Filter ${FES_NS}>${inner}</fes:Filter>`;

// Eine WFS-Abfrage mit Filter; liefert die gefundenen Flurstücke als Liste
async function wfsQuery(name, filter) {
  const p = new URLSearchParams({
    SERVICE: "WFS", VERSION: "2.0.0", REQUEST: "GetFeature", TYPENAMES: "cp:CadastralParcel",
    COUNT: "20", SRSNAME: "urn:ogc:def:crs:EPSG::4326", FILTER: filter
  });
  try {
    const r = await fetch(WFS_URL + "?" + p);
    const txt = await r.text();
    const xml = new DOMParser().parseFromString(txt, "application/xml");
    const ex = xml.getElementsByTagNameNS("*", "ExceptionText")[0];
    if (!r.ok || ex) { diag.push(name + ": " + (ex ? ex.textContent.trim().slice(0, 160) : "HTTP " + r.status)); return []; }
    const list = [...xml.getElementsByTagNameNS("*", "CadastralParcel")].map(parseParcel).filter(Boolean);
    diag.push(name + ": " + list.length + " Treffer");
    return list;
  } catch (e) { diag.push(name + ": " + e.message); return []; }
}

function parseParcel(el) {
  const g = n => el.getElementsByTagNameNS("*", n)[0];
  const a = g("areaValue");
  if (!a) return null;
  const polys = [];
  for (const pg of el.getElementsByTagNameNS("*", "Polygon")) {
    const rings = [];
    for (const pl of pg.getElementsByTagNameNS("*", "posList")) {
      const w = pl.textContent.trim().split(/\s+/).map(Number);
      const ring = [];
      for (let i = 0; i + 1 < w.length; i += 2) ring.push([w[i], w[i + 1]]);   // Breite, Länge
      rings.push(ring);
    }
    if (rings.length) polys.push(rings);
  }
  const ref = g("nationalCadastralReference");
  const lab = g("label");
  return { area: Number(a.textContent), polys, ref: ref ? ref.textContent.trim() : "", label: lab ? lab.textContent.trim() : "" };
}

// Sucht das Flurstück in drei Stufen: exaktes Kennzeichen, Kennzeichen-Anfang, Nummer + Umkreis
async function findParcel(gem, flur, m) {
  const ref14 = LAND + gem + pad(flur, 3) + pad(m[1], 5);
  const nenner = m[2] ? pad(m[2], 4) : "";
  const passt = f => f.ref.startsWith(ref14) && (nenner ? f.ref.slice(14, 18) === nenner : /^_*$/.test(f.ref.slice(14)));
  let list = await wfsQuery("A", fWrap(fEq("cp:nationalCadastralReference", ref14 + (nenner || "____") + "__")));
  let hit = list.find(passt); if (hit) return hit;
  list = await wfsQuery("B", fWrap(fLike("cp:nationalCadastralReference", ref14 + "*")));
  hit = list.find(passt); if (hit) return hit;
  const c = map.getCenter(), d = 0.04;
  const box = `<fes:BBOX><fes:ValueReference>cp:geometry</fes:ValueReference><gml:Envelope srsName="urn:ogc:def:crs:EPSG::4326"><gml:lowerCorner>${c.lat - d} ${c.lng - d}</gml:lowerCorner><gml:upperCorner>${c.lat + d} ${c.lng + d}</gml:upperCorner></gml:Envelope></fes:BBOX>`;
  const label = String(Number(m[1])) + (m[2] ? "/" + Number(m[2]) : "");
  list = await wfsQuery("C", fWrap(`<fes:And>${fEq("cp:label", label)}${box}</fes:And>`));
  hit = list.find(passt);
  if (!hit && list.length) diag.push("C: Kennzeichen der Treffer: " + list.map(f => f.ref).join(", "));
  return hit || null;
}

function showResult(res) {
  if (hl) map.removeLayer(hl);
  const p0 = res.polys[0] && res.polys[0][0] && res.polys[0][0][0];
  if (p0 && p0[0] > 45 && p0[0] < 56) {   // Koordinaten plausibel (Breitengrad in Deutschland)
    hl = L.featureGroup(res.polys.map(r => L.polygon(r, { color: "#0b6b4a", weight: 3, fillOpacity: .15, interactive: false }))).addTo(map);
    map.fitBounds(hl.getBounds(), { maxZoom: 19, padding: [30, 30] });
  }
  info("<strong style='font-size:1.4rem'>" + res.area.toLocaleString("de-DE") + " m²</strong>");
}

async function search() {
  const flur = document.getElementById("sf").value.trim();
  const nr = document.getElementById("sz").value.trim().replace(/\s+/g, "");
  const m = nr.match(/^(\d{1,5})(?:[\/-](\d{1,4}))?$/);
  if (!/^\d{1,3}$/.test(flur) || !m) { info("Bitte Flur (Zahl) und Flurstück (z. B. 289 oder 289/2) eingeben."); return; }
  diag = []; info("Suche …");
  try {
    let gem = sg.value.trim();
    if (!/^\d{4}$/.test(gem)) {   // Gemarkung aus der Kartenmitte ermitteln
      const id = parseId(await fetchFI(map.getCenter()));
      if (!id) { info("Gemarkung unbekannt. Schiebe die Kartenmitte auf ein Flurstück der Gemarkung oder gib die 4-stellige Gemarkungsnummer ein."); return; }
      gem = id.gem; sg.value = gem;
    }
    const nenner = m[2] ? pad(m[2], 4) : "____";
    const gmlId = "CadastralParcel_" + LAND + gem + pad(flur, 3) + pad(m[1], 5) + nenner + "__";
    const key = "fs:" + gmlId;
    let res = null;
    try {   // Flurstücke ändern sich selten: Treffer 30 Tage lokal merken
      const c = JSON.parse(localStorage.getItem(key) || "null");
      if (c && Date.now() - c.t < CACHE_MAX_AGE) res = c.res;
    } catch (e) {}
    if (!res) {
      res = await findParcel(gem, flur, m);
      if (res) { try { localStorage.setItem(key, JSON.stringify({ t: Date.now(), res })); } catch (e) {} }
    }
    if (!res) { info("Nicht gefunden: " + esc(gmlId) + "<br><small>" + esc(diag.join(" | ") || "keine Rückmeldung") + "</small>"); return; }
    showResult(res);
  } catch (err) {
    info("Suche fehlgeschlagen (" + err.message + ").");
  }
}
document.getElementById("go").onclick = search;
document.getElementById("sz").addEventListener("keydown", e => { if (e.key === "Enter") search(); });

locate();   // Beim Laden direkt am eigenen Standort starten
</script>
</body>
</html>
